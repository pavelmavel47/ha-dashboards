          - type: custom:button-card
            template: base
            entity: weather.forecast_home
            triggers_update: all
            tap_action:
              action: more-info
            custom_fields:
              loc: "[[[ return '<ha-icon icon=\"mdi:map-marker-outline\" style=\"--mdc-icon-size:15px;vertical-align:-3px\"></ha-icon> Humfeld'; ]]]"
              temp: "[[[ const t=Number(entity.attributes.temperature); if(isNaN(t)) return '–'; const [i,d]=t.toFixed(1).split('.'); return i+'<span style=\"font-size:38px\">,'+d+'°</span>'; ]]]"
              icon: |-
                [[[ const m={'clear-night':'weather-night','cloudy':'weather-cloudy','fog':'weather-fog','hail':'weather-hail','lightning':'weather-lightning','lightning-rainy':'weather-lightning-rainy','partlycloudy':'weather-partly-cloudy','pouring':'weather-pouring','rainy':'weather-rainy','snowy':'weather-snowy','snowy-rainy':'weather-snowy-rainy','sunny':'weather-sunny','windy':'weather-windy','windy-variant':'weather-windy-variant','exceptional':'alert-circle-outline'};
                      const ic=m[entity.state]||'weather-cloudy'; const col=entity.state==='sunny'?'#c98500':'#c3c2b7';
                      return '<ha-icon icon="mdi:'+ic+'" style="--mdc-icon-size:84px;color:'+col+'"></ha-icon>'; ]]]
              cond: |-
                [[[ const m={'clear-night':'Klare Nacht','cloudy':'Bewölkt','fog':'Nebel','hail':'Hagel','lightning':'Gewitter','lightning-rainy':'Gewitter mit Regen','partlycloudy':'Teils bewölkt','pouring':'Starkregen','rainy':'Regen','snowy':'Schnee','snowy-rainy':'Schneeregen','sunny':'Sonnig','windy':'Windig','windy-variant':'Windig und bewölkt','exceptional':'Außergewöhnlich'};
                      const a=entity.attributes; const f=a.apparent_temperature;
                      return (m[entity.state]||entity.state)+(f!==undefined&&f!==null?'<span style="color:#898781"> · gefühlt '+Number(f).toFixed(0)+'°</span>':''); ]]]
            styles:
              card:
                - padding: 12px 16px
              grid:
                - grid-template-areas: "\"loc loc\" \"temp icon\" \"cond cond\""
                - grid-template-columns: 1fr auto
                - grid-template-rows: min-content 1fr min-content
              custom_fields:
                loc:
                  - justify-self: start
                  - font-size: 11.5px
                  - color: "#898781"
                  - text-transform: uppercase
                  - letter-spacing: 0.06em
                temp:
                  - justify-self: start
                  - align-self: center
                  - font-size: 64px
                  - font-weight: "300"
                  - line-height: "1"
                  - letter-spacing: "-0.03em"
                icon:
                  - align-self: center
                  - justify-self: end
                cond:
                  - justify-self: start
                  - font-size: 15px
                  - font-weight: "500"
            view_layout:
              grid-area: hero
          - type: custom:button-card
            template: stat
            entity: weather.forecast_home
            name: Luftfeuchte
            label: "[[[ const h=entity.attributes.humidity; return (h!==undefined&&h!==null?Math.round(h):'–')+'<span style=\"font-size:12px;color:#898781\"> %</span>'; ]]]"
            view_layout:
              grid-area: m1
          - type: custom:button-card
            template: stat
            entity: weather.forecast_home
            name: Wind
            label: |-
              [[[ const a=entity.attributes; const s=a.wind_speed; const b=a.wind_bearing;
                    const dir=typeof b==='number'?['N','NO','O','SO','S','SW','W','NW'][Math.round(b/45)%8]:(b||'');
                    return (s!==undefined&&s!==null?Math.round(s):'–')+'<span style="font-size:12px;color:#898781"> '+(a.wind_speed_unit||'km/h')+(dir?' · '+dir:'')+'</span>'; ]]]
            view_layout:
              grid-area: m2
          - type: custom:button-card
            template: stat
            entity: weather.forecast_home
            name: Druck
            label: "[[[ const a=entity.attributes; const p=a.pressure; return (p!==undefined&&p!==null?Math.round(p):'–')+'<span style=\"font-size:12px;color:#898781\"> '+(a.pressure_unit||'hPa')+'</span>'; ]]]"
            view_layout:
              grid-area: m3
          - type: custom:button-card
            template: stat
            entity: weather.forecast_home
            name: Wolken
            label: "[[[ const c=entity.attributes.cloud_coverage; return (c!==undefined&&c!==null?Math.round(c):'–')+'<span style=\"font-size:12px;color:#898781\"> %</span>'; ]]]"
            view_layout:
              grid-area: m4
          - type: weather-forecast
            entity: weather.forecast_home
            show_current: false
            show_forecast: true
            forecast_type: daily
            card_mod:
              style: "ha-card { height: 100%; box-sizing: border-box; background: #1c1c1e; border-radius: 22px; border: 1px solid rgba(255,255,255,0.05); box-shadow: none; color: #f0efec; --primary-text-color: #f0efec; --secondary-text-color: #898781; overflow: hidden; }"
            view_layout:
              grid-area: fc
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: repeat(10, 1fr)
              grid-gap: 6px
              margin: "0"
              padding: "0"
              height: 48px
