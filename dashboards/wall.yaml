                  if(p<=5) return;
                  act+='<path d="'+d+'" fill="none" stroke="'+col+'" stroke-opacity=".35" stroke-width="'+wid(p)+'" stroke-linecap="round"/>';
                  const t=dur(p); for(let j=0;j<4;j++) dots+='<circle r="3.6" fill="'+col+'" filter="url(#gl)"><animateMotion dur="'+t+'s" repeatCount="indefinite" begin="-'+(t*j/4).toFixed(2)+'s"><mpath href="#'+id+'"/></animateMotion></circle>';
                };
                const hx=N.home.x-N.home.r;
                // sources -> home
                link('M150,106 C150,165 185,192 '+hx+',192', pv-Math.min(pv,exp+chg)>0?pv-Math.min(pv,exp+chg):0, C.pv, true);
                if(exp>5) link('M'+hx+',192 L96,192', exp, C.exp, true); else link('M96,192 L'+hx+',192', imp, C.grid, true);
                if(chg>5) link('M'+hx+',192 C185,192 150,220 150,278', chg, C.bat, true); else link('M150,278 C150,220 185,192 '+hx+',192', dis, C.bat, true);
                // home -> consumers
                cons.forEach(c=>link('M'+(N.home.x+N.home.r)+',192 C350,192 345,'+c.y+' '+(c.x-c.r)+','+c.y, c.v, C.dev, true));
                // home ring = share of sources
                const src=[[Math.max(pv-exp-chg,0),C.pv],[dis,C.bat],[imp,C.grid]];
                const tot=src.reduce((s,x)=>s+x[0],0)||1;
                const R=N.home.r, CI=2*Math.PI*R; let off=0, ring='';
                const gap=src.filter(s=>s[0]>0).length>1?4:0;
                src.forEach(([v,c])=>{ if(v<=0) return; const L=v/tot*CI; ring+='<circle cx="'+N.home.x+'" cy="'+N.home.y+'" r="'+R+'" fill="none" stroke="'+c+'" stroke-width="5" stroke-dasharray="'+Math.max(L-gap,.1)+' '+CI+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 '+N.home.x+' '+N.home.y+')"/>'; off+=L; });
                // battery soc arc
                const RB=N.bat.r+6, CB=2*Math.PI*RB;
                const node=(o,col,on)=>'<circle cx="'+o.x+'" cy="'+o.y+'" r="'+o.r+'" fill="#202023" stroke="'+col+'" stroke-width="2.5" stroke-opacity="'+(on?1:.35)+'"'+(on?' filter="url(#gl2)"':'')+'/>';
                let svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" style="position:absolute;inset:0">'
                 +'<defs><filter id="gl" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>'
                 +'<filter id="gl2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feComponentTransfer in="b" result="c"><feFuncA type="linear" slope=".45"/></feComponentTransfer><feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge></filter>'
                 +'<radialGradient id="hg" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#2c2c30"/><stop offset="1" stop-color="#1d1d20"/></radialGradient></defs>'
                 +base+act+dots
                 +node(N.sun,C.pv,pv>5)+node(N.grid,exp>5?C.exp:C.grid,imp>5||exp>5)+node(N.bat,C.bat,dis>5||chg>5)
                 +'<circle cx="'+N.bat.x+'" cy="'+N.bat.y+'" r="'+RB+'" fill="none" stroke="'+C.base+'" stroke-width="3"/>'
                 +'<circle cx="'+N.bat.x+'" cy="'+N.bat.y+'" r="'+RB+'" fill="none" stroke="'+C.bat+'" stroke-width="3" stroke-linecap="round" stroke-dasharray="'+(CB*soc/100)+' '+CB+'" transform="rotate(-90 '+N.bat.x+' '+N.bat.y+')" stroke-opacity="'+(soc>0?1:0)+'"/>'
                 +'<circle cx="'+N.home.x+'" cy="'+N.home.y+'" r="'+R+'" fill="url(#hg)" stroke="'+C.base+'" stroke-width="5"/>'+ring
                 +cons.map(c=>node(c,C.home,true)).join('')
                 +'</svg>';
                const pos=(x,y)=>'position:absolute;left:'+(x/W*100)+'%;top:'+(y/H*100)+'%;transform:translate(-50%,-50%);text-align:center;line-height:1.15;white-space:nowrap';
                const lab=(o,t)=>'<div style="'+pos(o.x,o.y+o.r+(o===N.bat?20:13))+';font-size:11px;color:#898781">'+t+'</div>';
                const inner=(o,icon,val,col,big)=>'<div style="'+pos(o.x,o.y)+'"><ha-icon icon="mdi:'+icon+'" style="--mdc-icon-size:'+(big?28:22)+'px;color:'+col+'"></ha-icon><div style="font-size:'+(big?20:13)+'px;font-weight:600;margin-top:1px">'+val+'</div></div>';
                const gridVal=exp>5?'<span style="color:#0ca30c">↑ '+fmt(exp)+'</span>':fmt(imp);
                const batVal=dis>5?'↓ '+fmt(dis):(chg>5?'↑ '+fmt(chg):soc+'<small> %</small>');
                const pvD=n('sensor.daily_pv_generation'), eig=pvD>0?Math.max(0,Math.min(100,Math.round((pvD-n('sensor.daily_exported_energy_from_pv'))/pvD*100))):0;
                const self=n('sensor.daily_direct_energy_consumption'), impD=n('sensor.daily_imported_energy'); const aut=(self+impD)>0?Math.round(self/(self+impD)*100):0;
                let out=svg
                 +inner(N.sun,'white-balance-sunny',fmt(pv),C.pv)+lab(N.sun,'Sonne')
                 +inner(N.grid,'transmission-tower',gridVal,exp>5?C.exp:C.grid)+lab(N.grid,exp>5?'Einspeisung':'Netz')
                 +inner(N.bat,'battery-high',batVal,C.bat)+lab(N.bat,(dis>5||chg>5)?'Akku '+soc+' %':'Akku')
                 +'<div style="'+pos(N.home.x,N.home.y)+'"><ha-icon icon="mdi:home-variant" style="--mdc-icon-size:26px;color:#f0efec"></ha-icon><div style="font-size:22px;font-weight:600">'+fmt(load)+'</div><div style="font-size:10.5px;color:#898781">Haus</div></div>'
                 +cons.map(c=>inner(c,c.icon,c.txt||fmt(c.v),C.home)+lab(c,c.name)).join('')
                 +'<div style="position:absolute;left:4px;top:2px;font-size:11px;color:#898781;line-height:1.5;text-align:left"><div style="letter-spacing:.06em">HEUTE</div>'
                 +'<div><span style="color:#d95926">●</span> PV <b style="color:#f0efec">'+kwh(n('sensor.daily_pv_generation'))+'</b> kWh</div>'
                 +'<div><span style="color:#3987e5">●</span> Netz <b style="color:#f0efec">'+kwh(impD)+'</b> kWh</div></div>'
                 +'<div style="position:absolute;left:4px;bottom:2px;font-size:11px;color:#898781;text-align:left;line-height:1.5">'
                 +[['a','L1'],['b','L2'],['c','L3']].map(([p,l])=>{const v=n('sensor.meter_phase_'+p+'_active_power_raw'),a=Math.abs(v);return '<div><span style="color:'+(v<0?'#0ca30c':'#3987e5')+'">'+l+'</span> <b style="color:#f0efec">'+(a>=1000?(a/1000).toFixed(1).replace('.',','):Math.round(a))+'</b> '+(a>=1000?'kW':'W')+'</div>';}).join('')+'</div>'
                 +'<div style="position:absolute;left:'+(N.home.x/W*100)+'%;top:calc(2px + 1.5em);transform:translateX(-50%);font-size:11px;color:#898781;line-height:1.5;text-align:left;white-space:nowrap">'
                 +'<div>Eigenverbrauch <b style="color:#f0efec">'+eig+'</b> %</div><div>Autarkie <b style="color:#f0efec">'+aut+'</b> %</div></div>';
                return out; ]]]
