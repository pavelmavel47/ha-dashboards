title: Wall
kiosk_mode:
  mobile_settings:
    custom_width: 500
    hide_header: true
    hide_sidebar: true
swipe_nav:
  wrap: true
  animate: swipe
  prefer_horizontal: true
  enable_mouse_swipe: false
button_card_templates:
  base:
    show_icon: false
    show_name: false
    show_state: false
    show_label: false
    tap_action:
      action: none
    hold_action:
      action: none
    styles:
      card:
        - background: "#1c1c1e"
        - border-radius: 22px
        - border: 1px solid rgba(255,255,255,0.05)
        - box-shadow: none
        - height: 100%
        - padding: 12px
        - color: "#f0efec"
        - box-sizing: border-box
        - font-family: Roboto, system-ui, sans-serif
  tile:
    template: base
    show_icon: true
    show_name: true
    show_state: true
    tap_action:
      action: toggle
      haptic: light
    hold_action:
      action: more-info
    triggers_update: all
    styles:
      grid:
        - grid-template-areas: "\"i\" \"n\" \"s\""
        - grid-template-columns: 1fr
        - grid-template-rows: 1fr min-content min-content
      img_cell:
        - justify-content: start
        - align-items: start
      icon:
        - width: 28px
        - color: "#c3c2b7"
      name:
        - justify-self: start
        - font-size: 14px
        - font-weight: "500"
        - white-space: nowrap
        - overflow: hidden
        - text-overflow: ellipsis
        - max-width: 100%
      state:
        - justify-self: start
        - font-size: 12.5px
        - color: "#898781"
        - margin-top: 2px
      custom_fields:
        bar:
          - position: absolute
          - left: "0"
          - right: "0"
          - bottom: "0"
          - height: 4px
    state:
      - value: "on"
        styles:
          card:
            - background: "#ecebe6"
            - color: "#0b0b0b"
          icon:
            - color: "#c98500"
          state:
            - color: "#52514e"
  light:
    template: tile
    state_display: "[[[ if (entity.state !== 'on') return 'aus'; const b = entity.attributes.brightness; return b ? Math.round(b/2.55) + ' %' : 'an'; ]]]"
    custom_fields:
      bar: "[[[ const b = entity.attributes.brightness; if (entity.state!=='on' || !b) return ''; return '<div style=\"height:4px;width:'+Math.round(b/2.55)+'%;background:#c98500;border-radius:0 2px 2px 0\"></div>'; ]]]"
  sw:
    template: tile
    state_display: "[[[ return entity.state === 'on' ? 'an' : 'aus'; ]]]"
  stat:
    template: base
    show_name: true
    show_state: false
    show_label: true
    tap_action:
      action: more-info
    styles:
      card:
        - padding: 8px 12px
      grid:
        - grid-template-areas: "\"n\" \"l\""
        - grid-template-rows: min-content 1fr
      name:
        - justify-self: start
        - font-size: 11.5px
        - color: "#898781"
        - text-transform: uppercase
        - letter-spacing: 0.06em
      label:
        - justify-self: start
        - align-self: end
        - font-size: 19px
        - font-weight: "500"
        - color: "#f0efec"
        - white-space: nowrap
  nav:
    template: base
    show_icon: true
    styles:
      card:
        - background: transparent
        - border: none
        - padding: "0"
        - border-radius: 16px
      icon:
        - width: 24px
        - color: "#898781"
